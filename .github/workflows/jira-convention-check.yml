name: Jira Convention Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - develop
      - master

permissions:
  pull-requests: write

jobs:
  jira-convention-check:
    name: jira-convention-check
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────────────────────
      # FLOW 1: feature/* ➜ develop
      # Validate branch name convention and auto-fix the PR title.
      # ─────────────────────────────────────────────────────────────
      - name: "[develop] Validate branch and auto-fix PR title"
        if: github.base_ref == 'develop'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Validating Jira naming convention..."
          echo "Branch: $BRANCH_NAME"
          echo "PR Title: $PR_TITLE"

          BRANCH_REGEX='^(feature|bugfix|hotfix|chore|refactor)\/BMS-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'
          PR_TITLE_REGEX='^BMS-[0-9]+ .+$'

          # Validate branch name
          if [[ ! "$BRANCH_NAME" =~ $BRANCH_REGEX ]]; then
            echo ""
            echo "ERROR: Invalid branch name: $BRANCH_NAME"
            echo "Expected format:"
            echo "  feature/BMS-123-short-description"
            echo "  bugfix/BMS-123-short-description"
            echo "  hotfix/BMS-123-short-description"
            echo "  chore/BMS-123-short-description"
            echo "  refactor/BMS-123-short-description"
            echo ""
            echo "Why this is required:"
            echo "- Jira needs the issue key in the branch name to link development activity correctly."
            echo "- The expected issue key format is: BMS-<number>"
            exit 1
          fi

          # Extract Jira key and human-readable description from branch name
          JIRA_KEY=$(echo "$BRANCH_NAME" | grep -oP 'BMS-[0-9]+')
          DESCRIPTION=$(echo "$BRANCH_NAME" | sed -E 's/^(feature|bugfix|hotfix|chore|refactor)\/BMS-[0-9]+-//' | tr '-' ' ' | sed 's/\b\(.\)/\u\1/g')
          EXPECTED_TITLE="$JIRA_KEY $DESCRIPTION"

          echo "Extracted Jira Key: $JIRA_KEY"
          echo "Expected Title:     $EXPECTED_TITLE"

          # Title already follows convention — nothing to do
          if [[ "$PR_TITLE" =~ $PR_TITLE_REGEX ]]; then
            echo "✓ PR title follows convention."
            exit 0
          fi

          # Auto-fix PR title via GitHub API
          echo ""
          echo "PR title does not follow convention. Auto-fixing..."
          echo "  Old title: $PR_TITLE"
          echo "  New title: $EXPECTED_TITLE"

          curl -s -X PATCH \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            -d "{\"title\":\"$EXPECTED_TITLE\"}"

          echo "✓ PR title has been automatically updated to: $EXPECTED_TITLE"

      # ─────────────────────────────────────────────────────────────
      # FLOW 2: develop ➜ master
      # Only 'develop' is allowed as source. Title and description are
      # derived from the last feature branch merged into develop.
      # ─────────────────────────────────────────────────────────────
      - name: "[master] Validate source branch and auto-fix PR title"
        if: github.base_ref == 'master'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Base branch is 'master'. Checking source branch..."

          # Only develop is allowed to merge into master
          if [[ "$HEAD_BRANCH" != "develop" ]]; then
            echo ""
            echo "ERROR: Only 'develop' can merge directly into 'master'."
            echo "Current source branch: $HEAD_BRANCH"
            echo ""
            echo "To release to master, first merge your feature branch into 'develop',"
            echo "then open a PR from 'develop' to 'master'."
            exit 1
          fi

          echo "✓ Source branch is 'develop'. Proceeding..."
          echo ""

          # Fetch the last feature branch merged into develop via GitHub API
          echo "Looking up last merged PR into 'develop'..."

          BRANCH_REGEX='^(feature|bugfix|hotfix|chore|refactor)/BMS-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'

          LAST_FEATURE_BRANCH=$(curl -s \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/pulls?state=closed&base=develop&sort=updated&direction=desc&per_page=10" \
            | jq -r '[.[] | select(.merged_at != null)] | .[0].head.ref')

          echo "Last feature branch merged into develop: $LAST_FEATURE_BRANCH"

          # Validate that we got a proper Jira branch name
          if [[ -z "$LAST_FEATURE_BRANCH" || "$LAST_FEATURE_BRANCH" == "null" || ! "$LAST_FEATURE_BRANCH" =~ $BRANCH_REGEX ]]; then
            echo ""
            echo "WARNING: Could not determine a valid Jira feature branch from the last merged PR into 'develop'."
            echo "Please set the PR title manually using the format: BMS-<number> <description>"
            exit 1
          fi

          # Build title and description from the last feature branch
          JIRA_KEY=$(echo "$LAST_FEATURE_BRANCH" | grep -oP 'BMS-[0-9]+')
          DESCRIPTION=$(echo "$LAST_FEATURE_BRANCH" | sed -E 's/^(feature|bugfix|hotfix|chore|refactor)\/BMS-[0-9]+-//' | tr '-' ' ' | sed 's/\b\(.\)/\u\1/g')
          NEW_TITLE="$JIRA_KEY $DESCRIPTION"
          NEW_BODY="**Origin branch:** \`$LAST_FEATURE_BRANCH\`"$'\n\n'"Merging \`develop\` into \`master\` — transporting changes from \`$LAST_FEATURE_BRANCH\`."

          echo "New PR title:       $NEW_TITLE"
          echo "New PR description: $NEW_BODY"
          echo ""

          # Apply title and description via GitHub API
          curl -s -X PATCH \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER" \
            -d "$(jq -n --arg title "$NEW_TITLE" --arg body "$NEW_BODY" '{title: $title, body: $body}')"

          echo "✓ PR title and description have been automatically updated."
          echo "  Title: $NEW_TITLE"
          echo "  Body references origin branch: $LAST_FEATURE_BRANCH"